<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>えいごパズルマスター - 英検単語・イディオム学習</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2AB7CA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="英単語マスター">
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --dark: #2C3E50;
      --light: #F7F9FC;
      --success: #2ECC71;
      --danger: #E74C3C;
      --card-bg: #FFFFFF;
      --radius: 16px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      user-select: none;
    }

    body {
      background-color: #EBF3F5;
      color: var(--dark);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    #app {
      width: 100%;
      max-width: 650px;
      background: var(--light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 600px;
    }

    header {
      background: linear-gradient(135deg, var(--secondary), #2AB7CA);
      color: white;
      padding: 16px;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    .nav-btn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    main {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ホーム画面 */
    .hero-box {
      text-align: center;
      padding: 20px 10px;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-title {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--dark);
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.5;
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background: white;
      border: 3px solid #E0E6ED;
      padding: 16px;
      border-radius: var(--radius);
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--dark);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-grade-5 { border-color: #4ECDC4; color: #16A085; }
    .btn-grade-4 { border-color: #FFD166; color: #D68910; }
    .btn-grade-3 { border-color: #FF6B6B; color: #C0392B; }

    .btn-dict {
      background: #34495E;
      color: white;
      border: none;
      justify-content: center;
      gap: 8px;
    }

    /* ゲーム画面 */
    .game-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .badge {
      background: #EBF3F5;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #555;
    }

    .card-display {
      background: white;
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px solid #E2E8F0;
      position: relative;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .type-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: bold;
      background: #EDF2F7;
      color: #4A5568;
    }

    .word-text {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: 1px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .word-phonetic {
      font-size: 0.9rem;
      color: #718096;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .opt-btn {
      background: white;
      border: 2px solid #CBD5E0;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--dark);
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .opt-btn:hover {
      background: #F7FAFC;
      border-color: #A0AEC0;
    }

    .opt-btn.correct {
      background: #DEF7EC !important;
      border-color: #31C48D !important;
      color: #03543F !important;
    }

    .opt-btn.wrong {
      background: #FDE8E8 !important;
      border-color: #F98080 !important;
      color: #9B1C1C !important;
    }

    /* 解説ポップアップ/カード */
    .explain-card {
      display: none;
      background: #FFFBEB;
      border: 2px solid #FCD34D;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .explain-card.active {
      display: block;
    }

    .explain-title {
      font-weight: bold;
      color: #92400E;
      margin-bottom: 4px;
    }

    .explain-ex {
      color: #4B5563;
      font-style: italic;
      margin-top: 4px;
    }

    .next-btn {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: none;
    }

    .next-btn.active {
      display: block;
    }

    /* クリア・結果画面 */
    .result-box {
      background: white;
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .result-rank {
      font-size: 4rem;
      font-weight: 900;
      color: var(--primary);
      margin: 10px 0;
    }

    .result-score {
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    /* ずかん画面 */
    .dict-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dict-tab {
      flex: 1;
      padding: 8px;
      background: white;
      border: 2px solid #E2E8F0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.9rem;
    }

    .dict-tab.active {
      background: var(--secondary);
      color: white;
      border-color: var(--secondary);
    }

    .dict-list {
      background: white;
      border-radius: 12px;
      padding: 12px;
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: 1px solid #E2E8F0;
    }

    .dict-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #EDF2F7;
    }

    .dict-item:last-child {
      border-bottom: none;
    }

    .dict-en {
      font-weight: bold;
      color: var(--dark);
    }

    .dict-jp {
      font-size: 0.85rem;
      color: #4A5568;
    }

    .dict-star {
      color: #CBD5E0;
    }

    .dict-star.learned {
      color: #F6AD55;
    }

    ruby rt {
      font-size: 0.6em;
      color: #718096;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <button class="nav-btn" id="homeBtn" onclick="showScreen('homeScreen')" style="display:none;">ホーム</button>
    <h1>えいごパズルマスター</h1>
  </header>

  <main>
    <!-- ホーム画面 -->
    <div id="homeScreen" class="screen active">
      <div class="hero-box">
        <h2 class="hero-title">たのしく英検の単語・イディオムをおぼえよう！</h2>
        <p class="hero-desc">タイム制限なし！自分のペースでじっくり選んでまなべるよ。</p>
      </div>

      <div class="menu-group">
        <button class="btn btn-grade-5" onclick="startGame(5)">
          <span>英検 5級レベル</span>
          <span style="font-size:0.85rem; font-weight:normal;">(基礎単語・イディオム 68問)</span>
        </button>
        <button class="btn btn-grade-4" onclick="startGame(4)">
          <span>英検 4級レベル</span>
          <span style="font-size:0.85rem; font-weight:normal;">(日常生活・過去形 67問)</span>
        </button>
        <button class="btn btn-grade-3" onclick="startGame(3)">
          <span>英検 3級レベル</span>
          <span style="font-size:0.85rem; font-weight:normal;">(中学レベル・重要熟語 66問)</span>
        </button>
        <button class="btn btn-dict" onclick="openDictionary()">
          <span>📖 えいご単語ずかん</span>
        </button>
      </div>
    </div>

    <!-- クイズ画面 -->
    <div id="gameScreen" class="screen">
      <div class="game-status">
        <span class="badge" id="gradeBadge">5級</span>
        <span id="progressText">第 1 / 10 問</span>
        <span id="scoreText">スコア: 0</span>
      </div>

      <div class="card-display">
        <span class="type-tag" id="typeTag">単語</span>
        <div class="word-text" id="questionWord">apple</div>
      </div>

      <div class="options-grid" id="optionsContainer">
        <!-- 4択ボタンがここに動的に挿入されます -->
      </div>

      <div class="explain-card" id="explainCard">
        <div class="explain-title" id="explainTitle">せいかい！</div>
        <div id="explainMeaning">意味: りんご</div>
        <div class="explain-ex" id="explainExample">I like apples. (わたしはりんごがすきです)</div>
      </div>

      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">つぎの問題へ ➔</button>
    </div>

    <!-- クリア結果画面 -->
    <div id="resultScreen" class="screen">
      <div class="result-box">
        <h2>ステージクリア！</h2>
        <div class="result-rank" id="resultRank">S</div>
        <div class="result-score" id="resultScore">10問ちゅう 10問 せいかい！</div>
        <p id="resultComment" style="color:#666; margin-bottom:20px;">すばらしい！かんぺきです！</p>
        <button class="btn btn-grade-5" style="justify-content:center;" onclick="showScreen('homeScreen')">ホームにもどる</button>
      </div>
    </div>

    <!-- 図鑑画面 -->
    <div id="dictScreen" class="screen">
      <h2>単語・イディオムずかん</h2>
      <p style="font-size:0.85rem; color:#666;">クイズでせいかいした問題には ⭐ がつくよ！</p>
      
      <div class="dict-controls">
        <div class="dict-tab active" onclick="filterDict(5, this)">5級</div>
        <div class="dict-tab" onclick="filterDict(4, this)">4級</div>
        <div class="dict-tab" onclick="filterDict(3, this)">3級</div>
      </div>

      <div class="dict-list" id="dictList">
        <!-- 単語リストが挿入されます -->
      </div>
    </div>
  </main>
</div>

<script>
// --- 問題データベース（各級60問以上、合計201問） ---
const QUESTION_DATABASE = {
  5: [
    // 単語（名詞・動詞・形容詞など）
    { word: "apple", meaning: "<ruby>林檎<rt>りんご</rt></ruby>", options: ["りんご", "みかん", "ばなな", "ぶどう"], type: "単語", example: "I eat an apple. (わたしはりんごを食べます)" },
    { word: "cat", meaning: "ねこ", options: ["ねこ", "いぬ", "うさぎ", "とり"], type: "単語", example: "The cat is cute. (そのねこはかわいいです)" },
    { word: "book", meaning: "<ruby>本<rt>ほん</rt></ruby>", options: ["ほん", "ノート", "ペン", "つくえ"], type: "単語", example: "Read a book. (本を読みなさい)" },
    { word: "school", meaning: "<ruby>学校<rt>がっこう</rt></ruby>", options: ["がっこう", "こうえん", "いえ", "びょういん"], type: "単語", example: "I go to school. (わたしは学校に行きます)" },
    { word: "friend", meaning: "<ruby>友達<rt>ともだち</rt></ruby>", options: ["ともだち", "せんせい", "かぞく", "あかちゃん"], type: "単語", example: "He is my friend. (彼はいわたしの友達です)" },
    { word: "teacher", meaning: "<ruby>先生<rt>せんせい</rt></ruby>", options: ["せんせい", "いしゃ", "かしゅ", "がくせい"], type: "単語", example: "She is an English teacher. (彼女は英語の先生です)" },
    { word: "water", meaning: "<ruby>水<rt>みず</rt></ruby>", options: ["みず", "おちゃ", "ぎゅうにゅう", "ジュース"], type: "単語", example: "Drink some water. (お水を飲みなさい)" },
    { word: "summer", meaning: "<ruby>夏<rt>なつ</rt></ruby>", options: ["なつ", "はる", "あき", "ふゆ"], type: "単語", example: "I like summer. (わたしは夏が好きです)" },
    { word: "happy", meaning: "うれしい", options: ["うれしい", "かなしい", "おこっている", "つかれている"], type: "単語", example: "I am very happy. (わたしはとてもうれしいです)" },
    { word: "run", meaning: "<ruby>走<rt>はし</rt></ruby>る", options: ["はしる", "あるく", "とぶ", "およぐ"], type: "単語", example: "Run fast! (はやく走りなさい！)" },
    { word: "sun", meaning: "<ruby>太陽<rt>たいよう</rt></ruby>", options: ["たいよう", "つき", "ほし", "くも"], type: "単語", example: "The sun is hot. (太陽はあついです)" },
    { word: "bird", meaning: "<ruby>鳥<rt>とり</rt></ruby>", options: ["とり", "さかな", "むし", "いぬ"], type: "単語", example: "Look at the bird. (鳥をごらんなさい)" },
    { word: "music", meaning: "<ruby>音楽<rt>おんがく</rt></ruby>", options: ["おんがく", "えいが", "え", "スポーツ"], type: "単語", example: "I listen to music. (わたしは音楽を聴きます)" },
    { word: "desk", meaning: "<ruby>机<rt>つくえ</rt></ruby>", options: ["つくえ", "いす", "ベッド", "ドア"], type: "単語", example: "Clean your desk. (つくえをきれいにしなさい)" },
    { word: "chair", meaning: "<ruby>椅子<rt>いす</rt></ruby>", options: ["いす", "つくえ", "はこ", "かばん"], type: "単語", example: "Sit on the chair. (いすに座りなさい)" },
    { word: "father", meaning: "<ruby>父<rt>ちち</rt></ruby>（おとうさん）", options: ["おとうさん", "おかあさん", "おにいさん", "おとうと"], type: "単語", example: "My father is tall. (わたしのお父さんは背が高いです)" },
    { word: "mother", meaning: "<ruby>母<rt>はは</rt></ruby>（おかあさん）", options: ["おかあさん", "おとうさん", "おねえさん", "おばあさん"], type: "単語", example: "My mother is kind. (わたしのお母さんは親切です)" },
    { word: "house", meaning: "<ruby>家<rt>いえ</rt></ruby>", options: ["いえ", "みせ", "えき", "へや"], type: "単語", example: "This is my house. (ここがわたしの家です)" },
    { word: "park", meaning: "<ruby>公園<rt>こうえん</rt></ruby>", options: ["こうえん", "プール", "うみ", "やま"], type: "単語", example: "Let's go to the park. (公園に行こう)" },
    { word: "time", meaning: "<ruby>時間<rt>じかん</rt></ruby>", options: ["じかん", "とけい", "ひづけ", "あさ"], type: "単語", example: "What time is it? (いま何時ですか？)" },
    { word: "dog", meaning: "<ruby>犬<rt>いぬ</rt></ruby>", options: ["いぬ", "ねこ", "ライオン", "うま"], type: "単語", example: "I have a big dog. (わたしは大きな犬を飼っています)" },
    { word: "milk", meaning: "<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>", options: ["ぎゅうにゅう", "ジュース", "みず", "スープ"], type: "単語", example: "Drink your milk. (牛乳をのみなさい)" },
    { word: "egg", meaning: "<ruby>卵<rt>たまご</rt></ruby>", options: ["たまご", "パン", "にく", "さかな"], type: "単語", example: "I ate an egg. (わたしは卵を食べました)" },
    { word: "pencil", meaning: "<ruby>鉛筆<rt>えんぴつ</rt></ruby>", options: ["えんぴつ", "消しゴム", "定規", "ふでばこ"], type: "単語", example: "Use this pencil. (この鉛筆を使いなさい)" },
    { word: "bag", meaning: "<ruby>鞄<rt>かばん</rt></ruby>", options: ["かばん", "さいふ", "ふく", "くつ"], type: "単語", example: "Put it in your bag. (かばんの中に入れなさい)" },
    { word: "window", meaning: "<ruby>窓<rt>まど</rt></ruby>", options: ["まど", "ドア", "かべ", "ゆか"], type: "単語", example: "Open the window. (窓を開けなさい)" },
    { word: "door", meaning: "<ruby>扉<rt>とびら</rt></ruby>（ドア）", options: ["ドア", "まど", "やね", "庭"], type: "単語", example: "Close the door. (ドアを閉めなさい)" },
    { word: "red", meaning: "<ruby>赤<rt>あか</rt></ruby>", options: ["あか", "あお", "きいろ", "みどり"], type: "単語", example: "I like red apples. (赤いリンゴが好きです)" },
    { word: "blue", meaning: "<ruby>青<rt>あお</rt></ruby>", options: ["あお", "あか", "くろ", "しろ"], type: "単語", example: "The sky is blue. (空は青いです)" },
    { word: "big", meaning: "<ruby>大<rt>おお</rt></ruby>きい", options: ["おおきい", "ちいさい", "ながい", "みじかい"], type: "単語", example: "That is a big bus. (あれは大きなバスです)" },
    { word: "small", meaning: "<ruby>小<rt>ちい</rt></ruby>さい", options: ["ちいさい", "おおきい", "たかい", "ひくい"], type: "単語", example: "It is a small bird. (それは小さな鳥です)" },
    { word: "fast", meaning: "<ruby>速<rt>はや</rt></ruby>い", options: ["はやい", "おそい", "つよい", "よわい"], type: "単語", example: "He can run fast. (彼は速く走ることができます)" },
    { word: "sing", meaning: "<ruby>歌<rt>うた</rt></ruby>う", options: ["うたう", "おどる", "はなす", "きく"], type: "単語", example: "She can sing well. (彼女は歌がじょうずです)" },
    { word: "swim", meaning: "<ruby>泳<rt>およ</rt></ruby>ぐ", options: ["およぐ", "はしる", "あるく", "とぶ"], type: "単語", example: "I swim in summer. (夏におよぎます)" },
    { word: "read", meaning: "<ruby>読<rt>よ</rt></ruby>む", options: ["よむ", "かく", "きく", "みる"], type: "単語", example: "Read this book. (この本を読みなさい)" },
    { word: "write", meaning: "<ruby>書<rt>か</rt></ruby>く", options: ["かく", "よむ", "はなす", "うたう"], type: "単語", example: "Write your name. (なまえを書きなさい)" },
    { word: "speak", meaning: "<ruby>話<rt>はな</rt></ruby>す", options: ["はなす", "きく", "みる", "たべる"], type: "単語", example: "I speak Japanese. (わたしは日本語を話します)" },

// --- ゲーム状態変数 ---
let currentGrade = 5;
let currentQuestionIndex = 0;
let score = 0;
let currentQuestions = [];
let learnedWords = JSON.parse(localStorage.getItem('eigo_learned_words') || '{}');

// サウンドエフェクト (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
    osc.frequency.setValueAtTime(196, audioCtx.currentTime + 0.15); // G3
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  }
}

// 画面切り替え
function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  document.getElementById('homeBtn').style.display = (screenId === 'homeScreen') ? 'none' : 'block';
}

// シャッフル（フィッシャー–イェーツ）
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ゲーム開始
function startGame(grade) {
  currentGrade = grade;
  currentQuestionIndex = 0;
  score = 0;
  
  // 選択した級の全問題からランダムに10問選出（重複なし）
  const allGradeQuestions = QUESTION_DATABASE[grade];
  const shuffled = shuffleArray(allGradeQuestions);
  currentQuestions = shuffled.slice(0, 10);

  document.getElementById('gradeBadge').textContent = `英検 ${grade}級`;
  showScreen('gameScreen');
  renderQuestion();
}

// クイズ描画
function renderQuestion() {
  const q = currentQuestions[currentQuestionIndex];
  
  document.getElementById('progressText').textContent = `第 ${currentQuestionIndex + 1} / ${currentQuestions.length} 問`;
  document.getElementById('scoreText').textContent = `スコア: ${score}`;
  document.getElementById('typeTag').textContent = q.type;
  document.getElementById('questionWord').textContent = q.word;

  // 解説カード＆つぎへボタンの初期化
  document.getElementById('explainCard').classList.remove('active');
  document.getElementById('nextBtn').classList.remove('active');

  // 選択肢作成 (正解1つ + 不正解3つ)
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  // 不正解のダミーデータを作成
  let dummyOptions = [];
  const allItems = QUESTION_DATABASE[currentGrade];
  
  while (dummyOptions.length < 3) {
    const randomItem = allItems[Math.floor(Math.random() * allItems.length)];
    // ルビのタグを除去して純粋なテキストを比較・表示
    const cleanMeaning = randomItem.options[0];
    if (cleanMeaning !== q.options[0] && !dummyOptions.includes(cleanMeaning)) {
      dummyOptions.push(cleanMeaning);
    }
  }

  // 4つの選択肢をシャッフル
  const choices = shuffleArray([q.options[0], ...dummyOptions]);

  choices.forEach(choiceText => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = choiceText;
    btn.onclick = () => checkAnswer(choiceText, q.options[0], btn);
    container.appendChild(btn);
  });
}

// 回答チェック
function checkAnswer(selected, correct, clickedBtn) {
  const q = currentQuestions[currentQuestionIndex];
  const buttons = document.querySelectorAll('.opt-btn');
  
  // 全ボタン無効化
  buttons.forEach(b => b.onclick = null);

  const isCorrect = (selected === correct);

  if (isCorrect) {
    playSound('correct');
    clickedBtn.classList.add('correct');
    score += 10;
    
    // 単語を学習済み（⭐）としてローカルストレージに保存
    learnedWords[q.word] = true;
    localStorage.setItem('eigo_learned_words', JSON.stringify(learnedWords));

    document.getElementById('explainTitle').textContent = '⭕ せいかい！';
    document.getElementById('explainTitle').style.color = '#2ECC71';
  } else {
    playSound('wrong');
    clickedBtn.classList.add('wrong');
    
    // 正解のボタンを緑色にする
    buttons.forEach(b => {
      if (b.textContent === correct) b.classList.add('correct');
    });

    document.getElementById('explainTitle').textContent = '❌ おしい！';
    document.getElementById('explainTitle').style.color = '#E74C3C';
  }

  // 解説を表示
  document.getElementById('explainMeaning').innerHTML = `<strong>意味:</strong> ${q.meaning}`;
  document.getElementById('explainExample').textContent = q.example;
  document.getElementById('explainCard').classList.add('active');

  // 「つぎの問題へ」ボタンを表示
  document.getElementById('nextBtn').classList.add('active');
}

// 次の問題へ
function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < currentQuestions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

// クリア画面表示
function showResult() {
  showScreen('resultScreen');
  const total = currentQuestions.length;
  const correctCount = score / 10;
  
  document.getElementById('resultScore').textContent = `${total}問ちゅう ${correctCount}問 せいかい！`;

  let rank = 'C';
  let comment = 'つぎは もっと たかいスコアを めざそう！';

  if (correctCount === total) {
    rank = 'S';
    comment = 'すばらしい！パーフェクトクリアです！';
  } else if (correctCount >= total * 0.8) {
    rank = 'A';
    comment = 'すごい！あとすこしで パーフェクト！';
  } else if (correctCount >= total * 0.6) {
    rank = 'B';
    comment = 'よくがんばったね！なんども チャレンジしよう！';
  }

  document.getElementById('resultRank').textContent = rank;
  document.getElementById('resultComment').textContent = comment;
}

// 単語図鑑表示
function openDictionary() {
  showScreen('dictScreen');
  filterDict(5, document.querySelectorAll('.dict-tab')[0]);
}

function filterDict(grade, tabElem) {
  document.querySelectorAll('.dict-tab').forEach(t => t.classList.remove('active'));
  if (tabElem) tabElem.classList.add('active');

  const listContainer = document.getElementById('dictList');
  listContainer.innerHTML = '';

  const questions = QUESTION_DATABASE[grade];
  questions.forEach(q => {
    const isLearned = learnedWords[q.word] || false;
    const item = document.createElement('div');
    item.className = 'dict-item';
    item.innerHTML = `
      <div>
        <div class="dict-en">${q.word} <span style="font-size:0.75rem; color:#888;">(${q.type})</span></div>
        <div class="dict-jp">${q.meaning}</div>
      </div>
      <div class="dict-star ${isLearned ? 'learned' : ''}">${isLearned ? '★ マスター' : '☆'}</div>
    `;
    listContainer.appendChild(item);
  });
}
</script>
